; PHP Configuration for Shared Hosting Laravel

; Try to enable mbstring (format bisa berbeda per hosting)
extension=mbstring
extension=mbstring.so

; Memory & Upload Settings
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 300
max_input_time = 300

; Error Settings
display_errors = Off
log_errors = On
error_log = error_log

; Required Extensions (try to enable)
extension=pdo
extension=pdo_mysql
extension=openssl
extension=tokenizer
extension=xml
extension=ctype
extension=json
extension=fileinfo
